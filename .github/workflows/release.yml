name: OpenCode Chinese Release

on:
  push:
    branches:
      - main
    paths:
      - "cli-go/**"
      - "scripts/**"
      - ".github/workflows/release.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Official OpenCode release tag; empty means latest"
        required: false
        type: string
      release_tag:
        description: "Tag used in this repository; empty means upstream_tag"
        required: false
        type: string

concurrency:
  group: opencode-chinese-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: anomalyco/opencode

jobs:
  resolve:
    name: Resolve upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      upstream_tag: ${{ steps.resolve.outputs.upstream_tag }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_UPSTREAM: ${{ github.event.inputs.upstream_tag }}
          REQUESTED_RELEASE: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail

          latest="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name')"
          upstream="${REQUESTED_UPSTREAM:-$latest}"
          release="${REQUESTED_RELEASE:-$upstream}"

          [[ "$upstream" =~ ^v[0-9A-Za-z._-]+$ ]] || {
            echo "Invalid upstream tag: $upstream" >&2
            exit 1
          }
          [[ "$release" =~ ^[0-9A-Za-z._-]+$ ]] || {
            echo "Invalid release tag: $release" >&2
            exit 1
          }

          should_build=true
          if [[ "${{ github.event_name }}" == "schedule" ]] &&
             gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release}" >/dev/null 2>&1; then
            should_build=false
          fi

          echo "should_build=$should_build" >>"$GITHUB_OUTPUT"
          echo "upstream_tag=$upstream" >>"$GITHUB_OUTPUT"
          echo "release_tag=$release" >>"$GITHUB_OUTPUT"
          echo "version=${upstream#v}" >>"$GITHUB_OUTPUT"
          echo "Upstream: $upstream; release: $release; build: $should_build"

  validate:
    name: Validate translation tool
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli-go/go.mod
          cache: true
          cache-dependency-path: cli-go/go.sum
      - name: Check formatting, tests, and static analysis
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l cli-go)"
          [[ -z "$unformatted" ]] || {
            echo "Run gofmt on:" >&2
            echo "$unformatted" >&2
            exit 1
          }
          (cd cli-go && go test ./... && go vet ./...)
          python3 -m py_compile scripts/patch-build-ts.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("cli-go/internal/core/assets/opencode-i18n")
          for path in root.rglob("*.json"):
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
          print("Translation JSON files are valid")
          PY

  translation-gate:
    name: Require complete translation match
    needs: [resolve, validate]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve.outputs.upstream_tag }}
          path: build/upstream
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli-go/go.mod
          cache: true
          cache-dependency-path: cli-go/go.sum
      - name: Build translation tool
        working-directory: cli-go
        run: go build -trimpath -o ../dist/opencode-cli .
      - name: Verify every known translation still matches
        env:
          OPENCODE_SOURCE_DIR: ${{ github.workspace }}/build/upstream
        run: |
          ./dist/opencode-cli apply --dry-run --strict --min-match-rate 1
          ./dist/opencode-cli verify --dry-run
      - name: Verify target-filter patch against upstream
        run: |
          python3 scripts/patch-build-ts.py build/upstream/packages/opencode/script/build.ts
          grep -F "OPENCODE_BUILD_TARGET support" build/upstream/packages/opencode/script/build.ts

  build-cli:
    name: Management CLI (${{ matrix.os }}-${{ matrix.arch }})
    needs: [resolve, validate]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            extension: .exe
          - os: linux
            arch: amd64
            extension: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli-go/go.mod
          cache: true
          cache-dependency-path: cli-go/go.sum
      - name: Build portable management CLI
        working-directory: cli-go
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags="-s -w" \
            -o "../dist/opencode-cli-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}" .
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  build-opencode:
    name: OpenCode TUI (${{ matrix.platform }})
    needs: [resolve, validate, translation-gate]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-x64
          - linux-x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve.outputs.upstream_tag }}
          path: build/upstream
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli-go/go.mod
          cache: true
          cache-dependency-path: cli-go/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: build/upstream/package.json
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('build/upstream/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Build translation tool
        working-directory: cli-go
        run: go build -trimpath -o ../dist/opencode-cli .
      - name: Patch and apply translations
        env:
          OPENCODE_SOURCE_DIR: ${{ github.workspace }}/build/upstream
        run: |
          python3 scripts/patch-build-ts.py build/upstream/packages/opencode/script/build.ts
          ./dist/opencode-cli apply --strict --min-match-rate 1
      - name: Build one portable TUI target
        env:
          OPENCODE_SOURCE_DIR: ${{ github.workspace }}/build/upstream
          OPENCODE_VERSION: ${{ needs.resolve.outputs.version }}
          OPENCODE_CHANNEL: latest
          OPENCODE_BUILD_TARGET: ${{ matrix.platform }}
        run: ./dist/opencode-cli build --platform "${{ matrix.platform }}" --deploy=false
      - name: Package portable binary
        env:
          PLATFORM: ${{ matrix.platform }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          extension=""
          [[ "$PLATFORM" == windows-* ]] && extension=".exe"
          binary="build/upstream/packages/opencode/dist/opencode-${PLATFORM}/bin/opencode${extension}"
          [[ -f "$binary" ]] || {
            echo "Binary not found: $binary" >&2
            exit 1
          }
          zip -j "dist/opencode-zh-CN-${RELEASE_TAG}-${PLATFORM}.zip" "$binary"
      - uses: actions/upload-artifact@v7
        with:
          name: opencode-${{ matrix.platform }}
          path: dist/opencode-zh-CN-*.zip
          if-no-files-found: error

  release:
    name: Publish verified release
    needs: [resolve, validate, translation-gate, build-cli, build-opencode]
    if: needs.resolve.outputs.should_build == 'true'  # 2026-08-09 重新启用自动发布：汉化版直接发 GitHub Release（install 脚本自动跟随）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - name: Package translation source and checksums
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          zip -r "dist/opencode-i18n-tool-${RELEASE_TAG}.zip" \
            cli-go install.ps1 install.sh README.md CHANGELOG.md scripts \
            -x "cli-go/.git/*" "*.exe"
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' |
              sort |
              xargs sha256sum >SHA256SUMS
          )
      - name: Create release notes
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
        run: |
          cat >release_notes.md <<EOF
          ## OpenCode CLI/TUI 简体中文自动构建

          - 官方版本：\`${UPSTREAM_TAG}\`
          - 翻译门禁：已知翻译规则 100% 匹配后才允许发布
          - 目标平台：Windows x64、Linux x64（含 WSL）

          | 平台 | 管理工具 | 汉化版 OpenCode |
          |---|---|---|
          | Windows x64 | \`opencode-cli-windows-amd64.exe\` | \`opencode-zh-CN-${RELEASE_TAG}-windows-x64.zip\` |
          | Linux/WSL x64 | \`opencode-cli-linux-amd64\` | \`opencode-zh-CN-${RELEASE_TAG}-linux-x64.zip\` |

          所有文件的 SHA-256 摘要见 \`SHA256SUMS\`。

          ### 安装管理工具

          Windows PowerShell：

          \`\`\`powershell
          irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.ps1 | iex
          \`\`\`

          Linux / WSL：

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash
          \`\`\`

          > 本项目是社区维护的非官方汉化构建，与 OpenCode 官方团队无隶属关系。
          EOF
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: "OpenCode ${{ needs.resolve.outputs.upstream_tag }} CLI/TUI 汉化版"
          body_path: release_notes.md
          files: dist/*
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
