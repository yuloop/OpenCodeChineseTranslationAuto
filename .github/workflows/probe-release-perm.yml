name: Probe release permission (临时诊断，用完即删)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          echo "== POST /releases (GITHUB_TOKEN, draft) =="
          gh api -i -X POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="probe-ci-github-token" \
            -f name="probe ci token (临时)" \
            -F draft=true 2>&1 | sed -n '1,8p;/^{/,$p' | head -20 || true
      - name: Probe with YU_TOKEN
        env:
          GH_TOKEN: ${{ secrets.YU_TOKEN }}
        run: |
          set -uo pipefail
          echo "== POST /releases (YU_TOKEN, draft) =="
          gh api -i -X POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="probe-ci-yu-token" \
            -f name="probe yu token (临时)" \
            -F draft=true 2>&1 | sed -n '1,8p;/^{/,$p' | head -20 || true
      - name: Cleanup any probe releases/tags
        if: always()
        env:
          GH_TOKEN: ${{ secrets.YU_TOKEN }}
        run: |
          set -uo pipefail
          for tag in probe-ci-github-token probe-ci-yu-token; do
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .id 2>/dev/null || true)
            if [[ -n "${id:-}" ]]; then gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}" || true; fi
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" >/dev/null 2>&1 || true
            echo "cleaned ${tag}"
          done
