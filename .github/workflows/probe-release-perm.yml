name: Probe release permission (临时诊断，用完即删)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare probe inputs
        run: |
          echo "probe notes" > probe-notes.md
          echo "probe asset" > probe-asset.txt
      - name: Action softprops/action-gh-release@v3 (与 V2 线同配置)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v2-cn-probe-action
          target_commitish: ${{ github.sha }}
          name: "probe action v2-cn"
          body_path: probe-notes.md
          files: probe-asset.txt
          overwrite_files: true
          fail_on_unmatched_files: true
        continue-on-error: true
      - name: Cleanup probe releases
        if: always()
        env:
          GH_TOKEN: ${{ secrets.YU_TOKEN }}
        run: |
          set -uo pipefail
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.tag_name | startswith("probe") or startswith("v2-cn-probe")) | .id'); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}" && echo "deleted release ${id}" || true
          done
          for tag in v2-cn-probe-action; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" >/dev/null 2>&1 && echo "deleted tag ${tag}" || true
          done
